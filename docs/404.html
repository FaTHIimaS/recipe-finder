<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Recipe Finder</title>
    <script>
      // Automatically redirect to the app root on GitHub Pages
      var segments = window.location.pathname.split('/').filter(Boolean);
      var basePath = segments.length > 0 ? '/' + segments[0] + '/' : '/';
      window.location.replace(window.location.origin + basePath);
    </script>
  </head>
  <body>
    <p>Redirecting to Recipe Finder...</p>
  </body>
</html>
